<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../sprites/favicon.png" type="image/png">
    <link rel="shortcut icon" href="../sprites/favicon.png" type="image/png">
    <title>Portfolio Renovation</title>
    <style>
        :root {
            --ink: #eceefb;
            --ink-soft: #a7adc8;
            --ink-faint: #6f748f;
            --bg-0: #0a0b0e;
            --bg-1: #0f1014;
            --line: rgba(255, 255, 255, 0.1);
            --line-hi: rgba(255, 255, 255, 0.34);
            --glow: rgba(255, 255, 255, 0.18);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: var(--bg-0);
            color: var(--ink);
            font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            background:
                radial-gradient(900px 420px at 70% -10%, rgba(255, 255, 255, 0.07), transparent 60%),
                linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 64%);
        }

        body::after {
            content: "";
            position: fixed;
            inset: -2px;
            z-index: -1;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
            background-size: 52px 52px;
            mask-image: radial-gradient(circle at 50% 20%, black, transparent 78%);
            -webkit-mask-image: radial-gradient(circle at 50% 20%, black, transparent 78%);
        }

        main {
            width: min(100% - 40px, 620px);
            padding: 46px 42px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: rgba(22, 23, 28, 0.72);
            box-shadow: 0 24px 70px -36px rgba(0, 0, 0, 0.9), 0 0 36px -18px var(--glow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .mark {
            width: 74px;
            height: 74px;
            margin-bottom: 28px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--line-hi);
        }

        p {
            margin: 0;
        }

        .eyebrow {
            color: var(--ink-faint);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            margin: 12px 0 16px;
            color: #fff;
            font-size: clamp(38px, 8vw, 58px);
            line-height: 1.04;
            font-weight: 700;
            letter-spacing: 0;
        }

        .copy {
            max-width: 460px;
            color: var(--ink-soft);
            font-size: 17px;
            line-height: 1.7;
        }

        .home {
            display: inline-flex;
            align-items: center;
            margin-top: 30px;
            color: var(--ink);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
        }

        .home:hover {
            color: #fff;
        }

        @media (max-width: 620px) {
            body {
                place-items: stretch;
                overflow-y: auto;
            }

            main {
                width: auto;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                padding: 34px 24px;
                border: 0;
                border-radius: 0;
                background: transparent;
                box-shadow: none;
            }

            .mark {
                width: 64px;
                height: 64px;
            }

            .copy {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <main aria-labelledby="page-title">
        <img src="../sprites/favicon.png" alt="" class="mark">
        <p class="eyebrow">Portfolio</p>
        <h1 id="page-title">Under Renovation</h1>
        <p class="copy">This page is currently unavailable while it is being redesigned. Please check back later.</p>
        <a class="home" href="/">Back to home -></a>
    </main>
</body>

</html>
