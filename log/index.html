<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../sprites/favicon.png" type="image/png">
    <link rel="shortcut icon" href="../sprites/favicon.png" type="image/png">
    <title>banda — log</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="blog.css">
</head>

<body class="log-page">
    <canvas id="bl-stars" aria-hidden="true"></canvas>

    <div class="bl-wrap">
        <aside class="bl-side">
            <div class="bl-orbit">
                <span class="bl-halo"></span>
                <span class="bl-ring"></span>
                <span class="bl-arc bl-arc-a"></span>
                <span class="bl-arc bl-arc-b"></span>
                <span class="bl-orbit-dot"></span>
                <img src="../sprites/profile.jpg" alt="Profile Picture" class="bl-avatar">
            </div>
            <div>
                <div class="bl-brand">banda</div>
                <div class="bl-tagline">Vulnerability Researcher</div>
                <p class="bl-bio">Interested in Red &amp; Purple Teaming</p>
                <div class="bl-stats" id="blStats" aria-hidden="true"></div>
                <div class="bl-links" aria-label="Social links">
                    <p>Also contact me on</p>
                    <a href="https://x.com/bddbba" target="_blank" rel="noopener">X - @bddbba</a>
                    <a href="https://github.com/banda59" target="_blank" rel="noopener">GitHub - github.com/banda59</a>
                    <a href="mailto:banda@outlook.kr">Email - banda@outlook.kr</a>
                </div>
                <a class="bl-home" href="../index.html">cd ~/portfolio →</a>
            </div>
        </aside>

        <main class="bl-main">
            <header class="bl-head">
                <p class="bl-term" aria-hidden="true">
                    <span class="bl-term-prompt">banda@log:~$</span>
                    <span id="blTerm"></span><span class="bl-caret"></span>
                </p>
                <h1>Recent <em>Posts</em></h1>
                <hr class="bl-rule">
            </header>

            <div id="postList"></div>

            <noscript>
                <p>JavaScript is required to show posts.</p>
            </noscript>

            <footer class="bl-foot">
                <span>&copy; 2026 banda. All rights reserved.</span>
                <span class="bl-foot-mono">EOF</span>
            </footer>
        </main>
    </div>

    <canvas id="bl-trail" aria-hidden="true"></canvas>
    <script src="./app.js"></script>
</body>

</html>
