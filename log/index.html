<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../sprites/favicon.png" type="image/png">
    <link rel="shortcut icon" href="../sprites/favicon.png" type="image/png">
    <title>banda</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="blog.css">
</head>

<body class="log-page">
    <div class="bl-wrap">
        <aside class="bl-side">
            <div class="bl-orbit">
                <span class="bl-wave"></span>
                <span class="bl-wave bl-wave-2"></span>
                <span class="bl-orbit-arc"></span>
                <span class="bl-orbit-dot"></span>
                <img src="../sprites/profile.jpg" alt="Profile Picture" class="bl-avatar">
            </div>
            <div>
                <div class="bl-brand">banda</div>
                <div class="bl-tagline">Vulnerability Researcher</div>
                <p class="bl-bio">Interested in Red &amp; Blue Teaming</p>
                <div class="bl-links" aria-label="Social links">
                    <p>Also follow me on</p>
                    <a href="https://x.com/bddbba" target="_blank" rel="noopener">X - @bddbba</a>
                    <a href="https://github.com/banda59" target="_blank" rel="noopener">GitHub - github.com/banda59</a>
                </div>
            </div>
        </aside>

        <main class="bl-main">
            <header class="bl-head">
                <h1>Recent <em>Posts</em></h1>
                <hr class="bl-rule">
            </header>

            <div id="postList"></div>

            <noscript>
                <p>JavaScript is required to show posts.</p>
            </noscript>

            <footer class="bl-foot">&copy; 2026 banda. All rights reserved.</footer>
        </main>
    </div>

    <canvas id="bl-trail" aria-hidden="true"></canvas>
    <script src="./app.js"></script>
</body>

</html>
